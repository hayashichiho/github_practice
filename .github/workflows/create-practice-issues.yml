name: 練習用Issueを登録

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: create-practice-issues
  cancel-in-progress: false

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Markdownから課題Issueを登録
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-practice-issues.mjs
